services:
  web_app:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: smartdashcam_web
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      - WEB_HOST=0.0.0.0
      - WEB_PORT=5000
      - AI_SERVICE_URL=http://ai_service:8001
      - WEB_APP_URL=http://web_app:5000
      - DATABASE_URL=sqlite:////app/storage/database/smartdashcam.db
      - MODELS_DIR=storage/models
      - SNAPSHOTS_DIR=storage/snapshots
    volumes:
      - ./storage:/app/storage
    depends_on:
      - ai_service
    restart: unless-stopped

  ai_service:
    build:
      context: .
      dockerfile: Dockerfile.ai
    container_name: smartdashcam_ai
    ports:
      - "8001:8001"
    env_file:
      - .env
    environment:
      - AI_HOST=0.0.0.0
      - AI_PORT=8001
      - WEB_APP_URL=http://web_app:5000
      - AI_SERVICE_URL=http://ai_service:8001
      - DATABASE_URL=sqlite:////app/storage/database/smartdashcam.db
      - MODELS_DIR=storage/models
      - SNAPSHOTS_DIR=storage/snapshots
    volumes:
      - ./storage:/app/storage
    restart: unless-stopped